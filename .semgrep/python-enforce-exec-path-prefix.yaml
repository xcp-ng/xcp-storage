rules:
  - id: python-enforce-exec-path-prefix
    languages: [python]
    severity: WARNING
    message: "Executable path variable `$VARIABLE` must use `EXEC_PATH_` or `_EXEC_PATH_` prefix."
    patterns:
      - pattern-either:
          # Assigned an executable path: `x = "/usr/bin/x"`, `x = Path("/usr/bin/x")`.
          - patterns:
              - pattern-either:
                  - pattern: '$VARIABLE = "$PATH"'
                  - pattern: 'self.$VARIABLE = "$PATH"'
                  - pattern: '$VARIABLE = Path("$PATH")'
                  - pattern: 'self.$VARIABLE = Path("$PATH")'
              - metavariable-regex:
                  metavariable: $PATH
                  regex: |-
                    (?x)
                    ^(?:
                        /(?:usr/(?:local/)?)?s?bin/.+
                      | /usr/(?:local/)?libexec/.+
                      | /opt/.+/s?bin/.+
                    )$
          # Assigned the result of `get_exec_path`.
          - pattern: "$VARIABLE = get_exec_path(...)"
          - pattern: "self.$VARIABLE = get_exec_path(...)"
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!_?EXEC_PATH_)\w+$'
