rules:
  - id: python-enforce-pytest-raises-variable-suffix
    languages: [python]
    severity: WARNING
    message: "Variable `$NAME` of `pytest.raises` must be named `exc_info` or end with `_exc_info`."
    patterns:
      - pattern-either:
          - pattern: |
              with pytest.raises(...) as $NAME:
                  ...
          - pattern: |
              with ..., pytest.raises(...) as $NAME, ...:
                  ...
      - focus-metavariable: $NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?!(?:\w*_)?exc_info$)\w+$'
