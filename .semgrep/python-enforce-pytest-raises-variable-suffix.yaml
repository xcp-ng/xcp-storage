rules:
  - id: python-enforce-pytest-raises-variable-suffix
    languages: [python]
    severity: WARNING
    message: "Variable `$VARIABLE` of `pytest.raises` must be named `exc_info` or end with `_exc_info`."
    patterns:
      - pattern: |
          with pytest.raises(...) as $VARIABLE:
              ...
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!(?i:(?:\w*_)?exc_info)$)\w+$'
