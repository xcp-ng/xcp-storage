rules:
  - id: python-enforce-pytest-raises-variable-suffix
    languages: [python]
    severity: WARNING
    message: "Variable `$VARIABLE` of `pytest.raises` (or `raises_exactly`) must be named `exc_info` or end with `_exc_info`."
    patterns:
      - pattern-either:
          - pattern: |
              with pytest.raises(...) as $VARIABLE:
                  ...
          - pattern: |
              with tests.utils.exception.raises_exactly(...) as $VARIABLE:
                  ...
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!(?i:(?:\w*_)?exc_info)$)\w+$'
