rules:
  - id: python-enforce-wraps-on-wrapper
    languages: [python]
    severity: WARNING
    message: "Wrapper function `$WRAPPER` of a decorator must be decorated with `wraps` (`@wraps($FUNCTION)`), otherwise it loses the name, the docstring and the attributes of the decorated function."
    patterns:
      - pattern-either:
          - pattern-inside: |
              def $DECORATOR(..., $FUNCTION, ...):
                  ...
                  def $WRAPPER(..., *$ARGS, **$KWARGS):
                      ...
                  ...
                  return $WRAPPER
          - pattern-inside: |
              def $DECORATOR(..., $FUNCTION: $TYPE, ...):
                  ...
                  def $WRAPPER(..., *$ARGS, **$KWARGS):
                      ...
                  ...
                  return $WRAPPER
          - pattern-inside: |
              def $DECORATOR(..., $FUNCTION, ...):
                  ...
                  def $WRAPPER(..., *$ARGS: $ARGS_TYPE, **$KWARGS: $KWARGS_TYPE):
                      ...
                  ...
                  return $WRAPPER
          - pattern-inside: |
              def $DECORATOR(..., $FUNCTION: $TYPE, ...):
                  ...
                  def $WRAPPER(..., *$ARGS: $ARGS_TYPE, **$KWARGS: $KWARGS_TYPE):
                      ...
                  ...
                  return $WRAPPER
      - pattern-either:
          - pattern: |
              def $WRAPPER(..., *$ARGS, **$KWARGS):
                  ...
                  $FUNCTION(..., *$ARGS, **$KWARGS)
                  ...
          - pattern: |
              def $WRAPPER(..., *$ARGS: $ARGS_TYPE, **$KWARGS: $KWARGS_TYPE):
                  ...
                  $FUNCTION(..., *$ARGS, **$KWARGS)
                  ...
      - pattern-not: |
          @wraps(...)
          def $WRAPPER(...):
              ...
      - pattern-not: |
          @functools.wraps(...)
          def $WRAPPER(...):
              ...
      - focus-metavariable: $WRAPPER
