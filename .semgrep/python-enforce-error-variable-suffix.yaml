rules:
  - id: python-enforce-error-variable-suffix
    languages: [python]
    severity: WARNING
    message: "Error variable `$VARIABLE` must be named `error` or end with `_error`."
    patterns:
      - pattern-either:
          # Assigned an error: `x = OSError(...)`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE = $CLASS(...)"
                  - pattern: "self.$VARIABLE = $CLASS(...)"
              - metavariable-regex:
                  metavariable: $CLASS
                  regex: '^(?:\w+\.)*\w*Error$'
          # Declared as an error: `x: Optional[OSError]`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE: $TYPE"
                  - pattern: "$VARIABLE: $TYPE = ..."
                  - pattern: "self.$VARIABLE: $TYPE = ..."
                  - pattern: |
                      def $FUNCTION(..., $VARIABLE: $TYPE, ...):
                          ...
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: |-
                    (?x)
                    (?(DEFINE)
                        (?<ERROR_TYPE>
                            (?:\w+\.)*\w*Error
                        )
                    )
                    ^(?:
                        (?&ERROR_TYPE)
                      | Optional\[\s*(?&ERROR_TYPE)\s*\]
                      | Final\[\s*(?&ERROR_TYPE)\s*\]
                      | Union\[.*\b(?&ERROR_TYPE)(?!\w).*\]
                      | (?&ERROR_TYPE)\s*\|\s*None
                      | None\s*\|\s*(?&ERROR_TYPE)
                    )$
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!(?i:(?:\w*_)?error)$)\w+$'
