rules:
  - id: python-enforce-file-variable-suffix
    languages: [python]
    severity: WARNING
    message: "File variable `$VARIABLE` must be named `file` or end with `_file`."
    patterns:
      - pattern-either:
          # Assigned an opened file: `x = open(...)`, `with path.open() as x`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE = $EXPRESSION"
                  - pattern: "self.$VARIABLE = $EXPRESSION"
                  - pattern: |
                      with $EXPRESSION as $VARIABLE:
                          ...
              - metavariable-pattern:
                  metavariable: $EXPRESSION
                  patterns:
                    - pattern-either:
                        - pattern: "open(...)"
                        - pattern: "io.open(...)"
                        - pattern: "os.fdopen(...)"
                        - pattern: "Path(...).open(...)"
                        - pattern: "tempfile.NamedTemporaryFile(...)"
                        - pattern: "tempfile.TemporaryFile(...)"
                        - pattern: "tempfile.SpooledTemporaryFile(...)"
                        - pattern: "$SOCKET.makefile(...)"
                        - patterns:
                            - pattern: "$PATH.open(...)"
                            - metavariable-regex:
                                metavariable: $PATH
                                regex: '^(?i:(?:[\w.]*[._])?path)$'
          # Declared as a file: `x: Optional[TextIO]`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE: $TYPE"
                  - pattern: "$VARIABLE: $TYPE = ..."
                  - pattern: "self.$VARIABLE: $TYPE = ..."
                  - pattern: |
                      def $FUNCTION(..., $VARIABLE: $TYPE, ...):
                          ...
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: |-
                    (?x)
                    (?(DEFINE)
                        (?<FILE_CLASS>
                            TextIOWrapper | TextIO | BinaryIO | IO
                          | BufferedReader | BufferedWriter | BufferedRandom | FileIO
                        )
                        (?<FILE_TYPE>
                            (?:\w+\.)*
                            (?&FILE_CLASS)
                            (?:\[[^\]]*\])?
                        )
                    )
                    ^(?:
                        (?&FILE_TYPE)
                      | Optional\[\s*(?&FILE_TYPE)\s*\]
                      | Final\[\s*(?&FILE_TYPE)\s*\]
                      | Union\[.*\b(?&FILE_TYPE)(?!\w).*\]
                      | (?&FILE_TYPE)\s*\|\s*None
                      | None\s*\|\s*(?&FILE_TYPE)
                    )$
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!(?i:(?:\w*_)?file)$)\w+$'
