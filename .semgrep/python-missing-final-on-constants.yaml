rules:
  - id: python-missing-final-on-constants
    languages: [python]
    severity: WARNING
    message: "Constant `$CONST` must be annotated with `Final`. Fix: `$CONST: Final = $VAL`"
    patterns:
      - pattern: "$CONST = $VAL"
      - metavariable-regex:
          metavariable: $CONST
          regex: "^[A-Z_][A-Z0-9_]*$"
      # We use a regex, not `pattern-not: "$CONST: Final = $VAL"`: semgrep fails to exclude a `Final` constant
      # when its name is also an imported name (e.g. a class attribute shadowing an imported constant).
      - pattern-not-regex: '\w+\s*:\s*Final\b'
      - pattern-not: "$CONST = TypeVar(...)"
      - pattern-not: "$CONST = ParamSpec(...)"
      - pattern-not-inside:
          patterns:
            - pattern: |
                class $ENUM(..., $BASE, ...):
                    ...
            - metavariable-regex:
                metavariable: $BASE
                regex: '^(?:Enum|IntEnum|StrEnum|Flag|IntFlag)$'
