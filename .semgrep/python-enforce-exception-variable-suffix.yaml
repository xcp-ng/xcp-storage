rules:
  - id: python-enforce-exception-variable-suffix
    languages: [python]
    severity: WARNING
    message: "Exception variable `$VARIABLE` must be named `exception` or end with `_exception`."
    patterns:
      - pattern-either:
          # Assigned an exception: `x = Exception(...)`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE = $CLASS(...)"
                  - pattern: "self.$VARIABLE = $CLASS(...)"
              - metavariable-regex:
                  metavariable: $CLASS
                  regex: '^(?:\w+\.)*\w*Exception$'
          # Declared as an exception: `x: Optional[Exception]`.
          - patterns:
              - pattern-either:
                  - pattern: "$VARIABLE: $TYPE"
                  - pattern: "$VARIABLE: $TYPE = ..."
                  - pattern: "self.$VARIABLE: $TYPE = ..."
                  - patterns:
                      - pattern: |
                          def $FUNCTION(..., $VARIABLE: $TYPE, ...):
                              ...
                      # Context manager exit methods have their own signature, checked by another rule.
                      - metavariable-regex:
                          metavariable: $FUNCTION
                          regex: '^(?!__a?exit__$)\w+$'
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: |-
                    (?x)
                    (?(DEFINE)
                        (?<EXCEPTION_TYPE>
                            (?:\w+\.)*\w*Exception
                        )
                    )
                    ^(?:
                        (?&EXCEPTION_TYPE)
                      | Optional\[\s*(?&EXCEPTION_TYPE)\s*\]
                      | Final\[\s*(?&EXCEPTION_TYPE)\s*\]
                      | Union\[.*\b(?&EXCEPTION_TYPE)(?!\w).*\]
                      | (?&EXCEPTION_TYPE)\s*\|\s*None
                      | None\s*\|\s*(?&EXCEPTION_TYPE)
                    )$
      - focus-metavariable: $VARIABLE
      - metavariable-regex:
          metavariable: $VARIABLE
          regex: '^(?!(?i:(?:\w*_)?exception)$)\w+$'
