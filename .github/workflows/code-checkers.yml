name: Code checkers

on: [push, pull_request]

env:
  PYTHON_VERSION: "3.14"

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        run: uv run ruff check

  static-type-checking:
    name: Static type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Mypy check
        run: uv run mypy

      - name: Pyrefly check
        run: uv run pyrefly check

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Semgrep scan
        # Python Flask is excluded due to false positive errors in the JSON-RPC utilities.
        run: |
          uv run semgrep scan \
          --config p/default \
          --config p/security-audit \
          --config .semgrep \
          --error \
          --exclude-rule python.flask.security.audit.directly-returned-format-string.directly-returned-format-string \
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
