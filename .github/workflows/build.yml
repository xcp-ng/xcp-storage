name: Build and tests

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            cmake \
            pkg-config \
            systemd-dev # Required for `systemd.pc`.

      # Same install directories as a package of the project.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX:PATH=/usr \
            -DCMAKE_INSTALL_SYSCONFDIR:PATH=/etc

      # Generated by the configuration (`cat` fails if it's missing).
      - name: Check build info
        run: cat src/xcp_storage/build_info.py

      - name: Build
        run: cmake --build build

      - name: Install
        run: |
          DESTDIR="$PWD/build/install" cmake --install build
          find build/install -type f

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install cmake pkg-config

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: uv run pytest -rfEs --cov --cov-report=term-missing
